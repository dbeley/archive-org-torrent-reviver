name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The tool has no runtime dependencies on purpose, so there is nothing to
      # install to run it. The suite is fully offline: it talks to fake
      # qBittorrent and archive.org servers bound to localhost.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Fail on unclosed resources
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  package:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build --no-link --print-out-paths .
      - run: nix flake check
      - name: The built binary runs
        run: nix run . -- --version
