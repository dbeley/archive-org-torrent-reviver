[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-reviver"
version = "0.1.0"
description = "Revive dead archive.org torrents by populating them from archive.org itself"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Beley" }]
keywords = ["bittorrent", "archive.org", "internet-archive", "qbittorrent", "seeding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: File Sharing",
  "Topic :: Internet",
]
# Deliberately zero runtime dependencies: stdlib only, so the tool is trivial to
# package and run on any host (including a NixOS torrent box).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ia-reviver = "ia_reviver.cli:main"

[project.urls]
Homepage = "https://github.com/dbeley/archive-org-torrent-reviver"
Source = "https://github.com/dbeley/archive-org-torrent-reviver"
Issues = "https://github.com/dbeley/archive-org-torrent-reviver/issues"
Changelog = "https://github.com/dbeley/archive-org-torrent-reviver/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
